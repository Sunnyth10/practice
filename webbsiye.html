<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLink: Unified Healthcare Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen">

    <div id="app" class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-indigo-600 shadow-lg fixed w-full top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <h1 class="text-3xl font-extrabold text-white flex items-center">
                    <i data-lucide="shield-check" class="w-7 h-7 mr-3 text-indigo-200"></i>
                    HealthLink
                </h1>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center text-white">
                        <span class="mr-2 hidden sm:inline">Viewing as:</span>
                        <span id="role-display" class="font-bold text-yellow-300">Patient</span>
                    </div>
                    <button id="role-toggle-btn" 
                        class="bg-white text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-lg font-semibold transition duration-150 shadow-md">
                        Switch to Provider View
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow p-4 sm:p-8 max-w-7xl mx-auto w-full mt-20">
            <!-- Loading and Error State -->
            <div id="status-message" class="hidden bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg" role="alert">
                <p class="font-bold">Loading Data...</p>
                <p>Simulating secure data fetch from unified sources.</p>
            </div>

            <!-- Dashboards -->
            <div id="dashboard-container">
                <!-- Content will be rendered here by JavaScript -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white p-4 text-center text-sm">
            <p>&copy; 2024 HealthLink | Hackathon Prototype for Unified Data & Interoperability</p>
        </footer>
    </div>
    
    <!-- Custom Modal for Alerts and LLM Responses -->
    <div id="custom-message-box" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-lg w-full transform translate-y-4 transition-transform duration-300 border-t-4 border-indigo-600">
            <h3 id="msg-title" class="text-xl font-bold mb-2 text-indigo-600"></h3>
            <div id="msg-content" class="text-gray-700 text-sm mb-4 max-h-96 overflow-y-auto"></div>
            <button onclick="document.getElementById('custom-message-box').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('custom-message-box').classList.remove('opacity-100')"
                class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition duration-150">
                Close
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
