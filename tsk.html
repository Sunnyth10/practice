<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Scheduler</title>
  <link rel="stylesheet" href="Task.css">
</head>
<body>
    <style>
        body {
  font-family: Arial, sans-serif;
  /* background-color: #f0f2f5; */

}

.container {
  width: 80%;
  max-width: 800px;
  margin: 30px auto;
  background-color: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
  background-color: #0f30c5;
  color: white;
  padding: 15px;
  text-align: center;
  border-radius: 5px;
  margin-bottom: 20px;
}

.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

/* .input-group input,
.input-group select,
.input-group button {
  padding: 10px;
  font-size: 16px;
  flex: 1;
} */

.task {
  display: flex;
  /* justify-content: space-between; */
  align-items: center;
  /* background-color: #eef1f7; */
  border: 1px solid black;
  padding: 15px;
  margin-bottom: 10px;

 
  border-radius: 5px; 
}

.task-info {
    display: flex;
  flex-direction: row;
  justify-content: space-around;

  
}

button.mark-done {
  background-color: #28a745;
  color: white;
  border: none;
  padding: 8px 12px;
  cursor: default;
  border-radius: 5px;
}

    </style>
</body>
<body>
  <div class="container">
    <h1>Task Scheduler</h1>
    
    <!-- Task Input Section -->
    <div class="input-group">
    <input type="text" name="task" placeholder="Enter Task">
     <select id="names" name="names">
        <option type="top">Top-priority</option>
        <option value="mid">mid-riority</option>
        <option value="low">low-priority</option>
    </select>
        <input type="date" value="date" id="date" name="date">
      <button>Add Task</button>
    </div>

    <!-- Task List -->
    <div class="task">
      <!-- <div class="task-info"> -->
        <span> practive </span>
        <span> priority:Top </span>
        <span> Deadline: 2023-08-24 </span>
      <!-- </div> -->
      <button class="mark-done">Mark Done</button>
    </div>

    <div class="task">
      <div class="task-info">
        <strong>Js Practice</strong>
        <span>Priority: top</span>
        <span>Deadline: 2023-09-01</span>
      </div>
      <button class="mark-done">Mark Done</button>
    </div>

    <div class="task">
      <div class="task-info">
        <strong>Maths Practice</strong>
        <span>Priority: top</span>
        <span>Deadline: 2023-08-31</span>
      </div>
      <button class="mark-done">Mark Done</button>
    </div>
  </div>
</body>
</html>
