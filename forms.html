<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<body>
    <h2>HTML Forms</h2>

    <form action="page2.html" method="get">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname" value="Sunny"><br><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname" value="Boy"><br><br>

        <input type="submit" value="Submit">
    </form>

    <p>
        If you click the "Submit" button, the form data will be sent to a page called <strong>page2.html</strong>.
    </p>
</body>
</html>
