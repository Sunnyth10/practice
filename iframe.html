<!DOCTYPE html>
<html>
<body>
    <h2>Iframe - target for a link</h2>
    <iframe src="padding.html" name="iframe_a" height="250px" width="50%" title="Iframe example">
    </iframe>
<p>
    <a href="padding.html" target="iframe_a">W3Schools.com</a>
</p>
<p>
    when the target attribute of a link matches the name of an iframe, the link will open in the iframe. 
</p>
</body>
</html>
