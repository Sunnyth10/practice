<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="forms">
    <lable for="name">Name</lable>
    <input type="text" id="name" placeholder="Your name">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="any@example.com">
    <label for="phone">phone</label>
    <input type="number" id ="phone" name="phone" placeholder="1234567890"><br>
    <lable for="gender">male</lable>
    <input type="radio" id="gender" name="gender" value="male">
    <lable for="gender">female</lable>
    <input type="radio" id="gender" name="gender" value="female"><br>
    <lable for="checkbox">HTML</lable>
    <input type="checkbox" id="checkbox" name="checkbox">
    <lable for="checkbox">CSS</lable>
    <input type="checkbox" id="checkbox" name="checkbox">    
    <lable for="checkbox">JAVA</lable>
    <input type="checkbox" id="checkbox" name="checkbox"><br>
    <label for="date">Date</label>
    <input type="date" id="date" name="date"><br>
    <label for="button">Button</label>
    <input type="button" id="button" name="button"><br>
    <label for="submit">Click here to submit</label>
    <input type="submit" id="submit" name="submit"><br>
    <label for="color">color</label>
    <input type="color" id="color"><br><br>
    <label for="file"></label>
    <input type="file" id="file" placeholder="Update your file here">
    <label for="search">Search</label>
    <input type="search" id="search" name="search" placeholder="Search here">
    <label for="range">Volume</label>
    <input type="range" id="range"><br>
    <lable for="select">Choose a name</lable><br>    
    <select id="names" name="names">

        <option type="choose">select</option>
        <option value="nikhil">Nikhil</option>
        <option value="Shashi">Shashi</option>
        <option value="satya">Satya</option>
        <option value="sigma">Sigma</option>
    </select><br>
    <label for="message">message:</label>
    <textarea id="message" name="message" rows="10" cols="50"></textarea>
    <input type="reset" value="reset">
</section>
</body>
</html>
