<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 20px;
}
.card-container{
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    width: 100%;
}
.card{
    flex: 1 1 250px; /*grow,shrink,flex-basis*/
    background-color: #4f4f4f;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    text-align: center;
}
.card img{
    max-width: 100%;
    border-radius: 8px;
    height: 600px;
}
.card h3{
    color: white;
    margin: 15px 0 10px;
}
</style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <img src="https://i.pinimg.com/736x/f3/9a/d2/f39ad265bcf761b5b47c0bc4294da8b6.jpg" alt="CAPTAIN AMERICA">
